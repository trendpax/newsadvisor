# Registro compartido de «Reacciones pasadas» de News Advisor (TrendPax).
# Cada hora mide, con las velas de biquote, las noticias de alto impacto ya publicadas y actualiza reacciones.json en la
# rama «datos». Solo resultados derivados (pips por publicación). Sin secretos ni actions de terceros: solo el
# GITHUB_TOKEN del propio workflow, con permiso de escritura únicamente en este job.
name: reacciones

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: reacciones
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Código del colector (main)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q colector-src
          cd colector-src
          git fetch -q --depth 1 "https://github.com/$REPO" "$SHA"
          git checkout -q FETCH_HEAD
      - name: Rama de datos
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q datos
          cd datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}"
          if git fetch -q --depth 1 origin datos; then
            git checkout -q -b datos FETCH_HEAD
          else
            git checkout -q --orphan datos
          fi
      - name: Medir
        run: python3 colector-src/colector/reacciones.py datos/reacciones.json
      - name: Publicar si ha cambiado
        run: |
          cd datos
          git add reacciones.json
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -q -m "reacciones: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:datos
          fi
